services:
  ros-humble-container:
    image: ros:humble
    container_name: ros-humble-container
    command: tail -f /dev/null
    ports:
      - 6080:80
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - DISPLAY=${DISPLAY}  
      - QT_X11_NO_MITSHM=1    
    volumes:
      - ./:/data
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # - /home/mehdi-khorasani/copy-of-dri-for-docker:/dev/dri
    extra_hosts:
    - "host.docker.internal:host-gateway"

  pcl-dev-container:
    build:
      context: .           # directory with your Dockerfile
      dockerfile: point-cloud-infra/Dockerfile
    container_name: pcl-dev-container
    command: tail -f /dev/null
    ports:
      - 6082:80
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - ./:/data
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    runtime: nvidia   # for legacy Compose (optional but safe)

  mysql:
      image: mysql:8.0
      container_name: stair_mysql
      environment:
        MYSQL_ROOT_PASSWORD: rootpass
        MYSQL_DATABASE: stairs_db
        MYSQL_USER: stairuser
        MYSQL_PASSWORD: stairpass
      ports:
        - "6083:3306"
      volumes:
        - ./mysql_data:/var/lib/mysql