services:
  pcl-dev-container:
    build:
      context: .           # directory with your Dockerfile
      dockerfile: Dockerfile
    container_name: pcl-dev-container
    command: tail -f /dev/null
    ports:
      - 6082:80
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - ./:/data
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    runtime: nvidia   # for legacy Compose (optional but safe)
